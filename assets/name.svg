<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" role="img" aria-label="Varun Nair, software engineer">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#1f8fd1"/>
      <stop offset="1" stop-color="#36bcf7"/>
    </linearGradient>
    <style>
      .name{font:700 58px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#g);opacity:0;animation:rise 1.1s ease-out .2s forwards}
      .sub{font:400 19px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7d8a96;opacity:0;letter-spacing:.5px;animation:fade 1s ease-out 1.2s forwards}
      .bar{fill:url(#g);transform-origin:400px 100px;transform:scaleX(0);animation:grow 1s ease-out .9s forwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @keyframes grow{to{transform:scaleX(1)}}
    </style>
  </defs>
  <text class="name" x="400" y="62" text-anchor="middle">Varun Nair</text>
  <rect class="bar" x="340" y="74" width="120" height="3" rx="1.5"/>
  <text class="sub" x="400" y="108" text-anchor="middle">Machine Learning  |  Simulation  |  Robotics and Sensing</text>
</svg>
